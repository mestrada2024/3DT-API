services:

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: dms-api

    restart: unless-stopped

    ports:
      - "127.0.0.1:3010:3010"

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - ./logs:/app/logs

  db:
    image: mariadb:11.8

    container_name: dms-api-db

    restart: unless-stopped

    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    volumes:
      - mariadb_data:/var/lib/mysql

    ports:
      - "127.0.0.1:3307:3306"

    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # dms-api ya tiene su propio proxy host en NPM con dominio y
        # certificado real de Let's Encrypt (2026-10-09) — reemplaza el
        # 3011 (certificado autofirmado), que el navegador rechazaba en
        # las llamadas fetch() en segundo plano a menos que alguien
        # visitara esa URL a mano primero y aceptara la advertencia.
        VITE_API_BASE_URL: https://dada-api.dms-smart.cloud

    container_name: dms-frontend

    restart: unless-stopped

    ports:
      - "3000:3000"

    depends_on:
      - api

volumes:
  mariadb_data:
