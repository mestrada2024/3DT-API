services:

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: dms-api

    restart: unless-stopped

    ports:
      - "127.0.0.1:3010:3010"

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - ./logs:/app/logs

  db:
    image: mariadb:11.8

    container_name: dms-api-db

    restart: unless-stopped

    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    volumes:
      - mariadb_data:/var/lib/mysql

    ports:
      - "127.0.0.1:3307:3306"

    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # El 443 público ahora lo maneja Nginx Proxy Manager (NPM), que
        # solo conoce el dominio de id-docs (lexid.dms-smart.cloud) — una
        # petición HTTPS por IP a ese puerto la rechaza en el handshake TLS
        # (unrecognized_name), lo que dejó el frontend 100% roto hasta
        # encontrarlo (2026-10-08). Hasta que dms-api tenga su propio
        # proxy host en NPM con dominio propio, usamos el 3011 (nginx del
        # host, sin pasar por NPM, ya confirmado funcionando con el
        # webhook de 3Dtracking).
        VITE_API_BASE_URL: https://129.80.217.232:3011

    container_name: dms-frontend

    restart: unless-stopped

    ports:
      - "3000:3000"

    depends_on:
      - api

volumes:
  mariadb_data:
