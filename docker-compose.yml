services:

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: dms-api

    restart: unless-stopped

    ports:
      - "3011:3010"

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - ./logs:/app/logs

  db:
    image: mariadb:11.8

    container_name: dms-api-db

    restart: unless-stopped

    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    volumes:
      - mariadb_data:/var/lib/mysql

    ports:
      - "3307:3306"

    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # El API ahora escucha HTTP plano en 3011 (puerto interno) — el
        # puerto 3010 lo toma nginx para TLS, ya que 3DTracking exige
        # HTTPS en el webhook (ver docs/dms-messaging.md / investigación
        # 2026-10-05). El frontend sigue sirviéndose por HTTP (3000), así
        # que llama a la API por HTTP también, en el nuevo puerto 3011.
        VITE_API_BASE_URL: http://129.80.217.232:3011

    container_name: dms-frontend

    restart: unless-stopped

    ports:
      - "3000:3000"

    depends_on:
      - api

volumes:
  mariadb_data:
