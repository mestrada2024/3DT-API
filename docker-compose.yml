services:

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: dms-api

    restart: unless-stopped

    ports:
      - "3010:3010"

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - ./logs:/app/logs

  db:
    image: mariadb:11.8

    container_name: dms-api-db

    restart: unless-stopped

    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    volumes:
      - mariadb_data:/var/lib/mysql

    ports:
      - "3307:3306"

    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # nginx termina TLS en el puerto 443 (estándar HTTPS) y hace proxy
        # interno al puerto 3010, donde escucha la app en HTTP plano dentro
        # del contenedor. Se movió de 3011 a 443 el 2026-10-06 porque 3DT
        # solo permite tráfico saliente de webhooks hacia el puerto HTTPS
        # estándar (ver docs/dms-messaging.md). El frontend llama a la API
        # por HTTPS en el 443, pasando por nginx.
        VITE_API_BASE_URL: https://129.80.217.232

    container_name: dms-frontend

    restart: unless-stopped

    ports:
      - "3000:3000"

    depends_on:
      - api

volumes:
  mariadb_data:
